# ============================================================================
# Nav2 (Humble) params — auto-generated by tools/gen_nav2_params.py
# cmodel: 测试车模型.cmodel   chassis: single_steer   holonomic: False
# footprint (motion center origin): [[1.308, 0.497], [1.308, -0.497], [-0.48, -0.497], [-0.48, 0.497]]
# limits: v=1.327 m/s  w=1.153 rad/s  a=0.5  d=0.4  (chassis ∩ wheel-motor capability)
# ============================================================================
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    laser_model_type: "likelihood_field"
    laser_max_range: 25.0
    laser_min_range: 0.1
    max_beams: 90
    max_particles: 2000
    min_particles: 300
    update_min_d: 0.15
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 1000
    transform_tolerance: 0.3

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    odom_topic: /odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "precise_goal_checker", "agv_goal_checker"]
    controller_plugins: ["FollowPath", "RouteFollow"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.08
    precise_goal_checker:                 # 线路跟随 (FollowPath) 逐段到位: ±20 mm / ±1°
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.017
    agv_goal_checker:                     # 到位由 RouteController 判定 (末段终点冻结在 odom 系)
      plugin: "agv_nav2_plugins::AgvGoalChecker"
      xy_goal_tolerance: 0.005
      yaw_goal_tolerance: 0.005
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.012
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 0.600
      max_angular_accel: 1.745
      simulate_ahead_time: 1.0
      desired_linear_vel: 0.600
      lookahead_dist: 0.5
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.8
      lookahead_time: 1.0
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 1.22
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.96
      regulated_linear_scaling_min_speed: 0.2
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.3
      max_robot_pose_search_dist: 10.0
    RouteFollow:
      plugin: "agv_nav2_plugins::RouteController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      body_head: 1.308
      body_tail: 0.480
      body_left: 0.497
      body_right: 0.497
      rotate_margin: 0.020
      rotate_max_w: 0.600
      rotate_accel: 1.047
      rotate_tol: 0.03
      yaw_tol: 0.003
      heading_fix_tol: 0.0026            # 到位精定位复核: 朝向差 > 0.15° 时按实测差值再对位
      cusp_tol: 0.04
      final_dist: 0.80                   # 进站前停车精定位的位置 (距终点)，其后纯跟踪进站直线收敛横向偏差
      final_stop_tol: 0.002
      final_lookahead: 0.25
      final_max_v: 0.200
      final_min_v: 0.008
      final_decel: 0.200
      tf_avg_s: 1.0
      steer_settle_s: 0.6
      block_wait_s: 2.0
      refine_localization: true   # 末段进站前对场景几何做 ICP 精定位
      refine_scan_topic: "/scan/laser"
      wall_half_thickness: 0.025
      refine_max_correction: 0.15
      desired_linear_vel: 0.600
      lookahead_dist: 0.5
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.8
      lookahead_time: 1.0
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 1.22
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.96
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[1.308, 0.497], [1.308, -0.497], [-0.480, -0.497], [-0.480, 0.497]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.53
        observation_sources: ""

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.73
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: true
      footprint: "[[1.308, 0.497], [1.308, -0.497], [-0.480, -0.497], [-0.480, 0.497]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.53
        observation_sources: laser laser1 laser0
        laser:
          topic: /scan/laser
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.53
          min_obstacle_height: 0.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        laser1:
          topic: /scan/laser1
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.53
          min_obstacle_height: 0.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        laser0:
          topic: /scan/laser0
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.53
          min_obstacle_height: 0.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.03
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased", "AgvRoute"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: false
    AgvRoute:
      plugin: "agv_nav2_plugins::RoutePlanner"
      body_head: 1.308
      body_tail: 0.480
      body_left: 0.497
      body_right: 0.497
      corner_radius: 0.0
      arc_min_turn: 0.35
      arc_max_turn: 2.6
      use_arcs: true
      step: 0.05
      route_wait_s: 1.5

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "adjust_pose"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    adjust_pose:
      plugin: "agv_nav2_plugins/AdjustPose"
      body_head: 1.308
      body_tail: 0.480
      body_left: 0.497
      body_right: 0.497
      rotate_margin: 0.020
      backup_margin: 0.03
      plan_extra_margin: 0.03            # 规划摆头/后退组合时比执行检查多留的余量
      rotate_max_w: 0.500
      rotate_accel: 1.047
      steer_settle_s: 0.6
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.000
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.745

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.327, 0.000, 1.153]
    min_velocity: [-0.663, -0.000, -1.153]
    max_accel: [0.500, 0.000, 1.745]
    max_decel: [-0.400, 0.000, -1.745]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
