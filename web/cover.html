<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>节点状态面板</title>
<!-- 小屏状态面板 (折叠屏外屏 748×720 等)：节点 / 实例 / 实时率 / 温度 / 激光俯视图 + 规划路径。只读，数据全部来自平台已有接口。
     底部两个按钮: 下发任务 = 执行当前场景任务列表 (3-1 任务流) 里的第一个；执行中再点两下 = 终止。
     退出 = 关闭面板应用 (只在面板应用里显示；之后点应用图标重新开启)。
     打开: http://<平台>/cover.html   可选参数 ?inst=i01 指定实例，?period=0.5 刷新周期 (秒，位姿/导航/地图；节点 CPU、温度、实例列表固定每 2 秒) -->
<style>
  /* 尺寸全部按视口短边 (vmin) 走；每个文字块都写死行高，保证 748×654 的外屏可用区里不被裁切 */
  :root { --bg:#05080c; --card:#0e151d; --line:#1d2a38; --fg:#e8eef5; --dim:#8a9bb0; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a52; --acc:#4da3ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif; overflow:hidden;
               -webkit-user-select:none; user-select:none; -webkit-text-size-adjust:none; }
  body { display:flex; flex-direction:column; padding:2.4vmin 2.8vmin; gap:1.8vmin; }
  header { flex:none; display:flex; align-items:center; justify-content:space-between; gap:3vmin; }
  header > div { min-width:0; }
  header .r { text-align:right; flex:none; }
  .l1 { font-size:5vmin; line-height:6.2vmin; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .l2 { font-size:3vmin; line-height:4vmin; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  header .r .l1 { font-size:3.7vmin; font-weight:600; color:var(--acc); font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:2.6vmin; height:2.6vmin; border-radius:50%; background:var(--dim); margin-right:1.4vmin; vertical-align:0.1vmin; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
  .tiles { flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:1.6vmin; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:2vmin; padding:1.2vmin 1.8vmin 1vmin; min-width:0; }
  .k { font-size:3vmin; line-height:3.8vmin; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .v { font-size:6.6vmin; line-height:7.6vmin; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tile .v small { font-size:3vmin; font-weight:500; color:var(--dim); margin-left:.6vmin; }
  .ok-t { color:var(--ok); } .warn-t { color:var(--warn); } .bad-t { color:var(--bad); }
  main { flex:1; min-height:0; display:flex; gap:1.8vmin; }
  .map { flex:1.1; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:2vmin; position:relative; overflow:hidden; }
  .map canvas { position:absolute; inset:0; width:100%; height:100%; }
  .side { flex:1; min-width:0; display:flex; flex-direction:column; gap:1.4vmin; }
  .row { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; background:var(--card); border:1px solid var(--line); border-radius:2vmin; padding:0 1.8vmin; overflow:hidden; }
  .row .v { font-size:4.3vmin; line-height:5.4vmin; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { flex:none; display:flex; gap:1.8vmin; }
  .btn { flex:1; min-width:0; height:10.5vmin; border-radius:2vmin; border:1px solid var(--acc); background:#10243a; color:var(--fg); font:600 4vmin/5vmin system-ui,"Noto Sans CJK SC",sans-serif;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2vmin; -webkit-tap-highlight-color:transparent; }
  .btn:active { background:#1b3a5c; }
  .btn.run { border-color:var(--ok); background:#0f2a1c; color:var(--ok); }
  .btn.arm { border-color:var(--bad); background:#3a1512; color:var(--bad); }
  .btn.off { border-color:var(--line); background:var(--card); color:var(--dim); }
  .btn.exit { flex:0 0 20vmin; border-color:var(--line); background:var(--card); color:var(--dim); }
  @media (max-aspect-ratio: 4/5) {        /* 竖屏 (普通手机全屏、主屏): 地图在上，信息在下 */
    main { flex-direction:column; } .map { flex:1.3; } .side { flex:none; display:grid; grid-template-columns:1fr 1fr; } .row { padding:1.4vmin 1.8vmin; }
  }
</style>
</head>
<body>
<header>
  <div><div class="l1"><span class="dot" id="dot"></span><span id="node">—</span></div><div class="l2" id="scene">—</div></div>
  <div class="r"><div class="l1" id="addr">—</div><div class="l2"><span id="ver">—</span> · <span id="clock">—</span></div></div>
</header>
<div class="tiles">
  <div class="tile"><div class="k">实时率</div><div class="v" id="rtf">—</div></div>
  <div class="tile"><div class="k">CPU</div><div class="v" id="cpu">—</div></div>
  <div class="tile"><div class="k">温度</div><div class="v" id="temp">—</div></div>
  <div class="tile"><div class="k">内存</div><div class="v" id="mem">—</div></div>
</div>
<main>
  <div class="map"><canvas id="cv"></canvas></div>
  <div class="side">
    <div class="row"><div class="k">实例</div><div class="v" id="inst">—</div></div>
    <div class="row"><div class="k">导航</div><div class="v" id="nav">—</div></div>
    <div class="row"><div class="k">位姿 (m, °)</div><div class="v" id="pose">—</div></div>
    <div class="row"><div class="k">仿真步 / 激光 (ms)</div><div class="v" id="ms">—</div></div>
  </div>
</main>
<div class="bar">
  <button class="btn off" id="task">下发任务</button>
  <button class="btn exit" id="exit" style="display:none">退出</button>
</div>
<script>
const Q = new URLSearchParams(location.search);
const PERIOD = Math.max(0.25, parseFloat(Q.get("period") || "0.5")) * 1000, SLOW = 2000;
const HUB = { at: 0, ns: null, is: null };
const $ = id => document.getElementById(id);
const STATUS = { running: "运行中", deploying: "部署中", degraded: "降级", error: "异常", stopped: "已停止" };
const NAV = { ARRIVED: "已到达", NAVIGATING: "导航中", IDLE: "空闲", FAILED: "失败", CANCELED: "已取消", PLANNING: "规划中", OBSTACLE_WAIT: "避障等待", SAFETY_STOP: "安全停车", ABORTED: "已中止" };
async function j(url) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 4000);
  try { const r = await fetch(url, { signal: c.signal, cache: "no-store" }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function set(id, text, cls) { const e = $(id); e.textContent = text; e.className = "v" + (cls ? " " + cls : ""); }
function num(id, v, unit, digits, cls) { const e = $(id); e.className = "v" + (cls ? " " + cls : ""); e.innerHTML = (v == null || isNaN(v) ? "—" : Number(v).toFixed(digits)) + (unit ? "<small>" + unit + "</small>" : ""); }
function draw(t) {
  const cv = $("cv"), r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  const g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  if (!t) return;
  const ranges = t.scan_ranges || [], n = ranges.length, rmax = 12, s = Math.min(W, H) / 2 / rmax * 0.94, cx = W / 2, cy = H / 2;
  const yaw = t.yaw || 0;                          // 弧度 (不归一化)
  g.strokeStyle = "#1d2a38"; g.lineWidth = dpr;
  for (const rr of [4, 8, 12]) { g.beginPath(); g.arc(cx, cy, rr * s, 0, 6.2832); g.stroke(); }
  g.fillStyle = "#4da3ff";
  const amin = t.scan_angle_min !== undefined ? t.scan_angle_min : -Math.PI;
  const ainc = t.scan_angle_inc !== undefined ? t.scan_angle_inc : 2 * Math.PI / Math.max(1, n);
  for (let i = 0; i < n; i++) {                      // 激光点 (世界朝向: 上 = +Y)
    const d = ranges[i]; if (!(d > 0.05) || d > rmax) continue;
    const a = yaw + amin + i * ainc;
    g.fillRect(cx + Math.cos(a) * d * s - dpr, cy - Math.sin(a) * d * s - dpr, 2 * dpr, 2 * dpr);
  }
  // 规划路径 (plan_curve: 含过渡圆弧的稠密曲线；没有则用拓扑节点折线) + 途经节点 + 目标点。到达后变暗
  const px = p => [cx + (p.x - t.x) * s, cy - (p.y - t.y) * s];
  const curve = (t.plan_curve && t.plan_curve.length > 1) ? t.plan_curve : (t.plan_path || []);
  const active = !/ARRIVED|IDLE|FAILED|CANCEL/.test(t.nav_status || "IDLE");
  if (curve.length > 1) {
    g.save(); g.globalAlpha = active ? 1 : 0.35;
    g.strokeStyle = "#ffb020"; g.lineWidth = 3 * dpr; g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath(); curve.forEach((p, i) => { const q = px(p); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.stroke();
    g.fillStyle = "#ffb020";
    (t.plan_path || []).forEach(p => { const q = px(p); g.beginPath(); g.arc(q[0], q[1], 4 * dpr, 0, 6.2832); g.fill(); });
    g.restore();
  }
  if (t.target_goal && (active || curve.length > 1)) {
    const q = px(t.target_goal);
    g.save(); g.globalAlpha = active ? 1 : 0.35; g.strokeStyle = "#ff5a52"; g.lineWidth = 3 * dpr;
    g.beginPath(); g.arc(q[0], q[1], 9 * dpr, 0, 6.2832); g.stroke();
    if (typeof t.target_goal.yaw === "number") { g.beginPath(); g.moveTo(q[0], q[1]); g.lineTo(q[0] + Math.cos(t.target_goal.yaw) * 20 * dpr, q[1] - Math.sin(t.target_goal.yaw) * 20 * dpr); g.stroke(); }
    g.restore();
  }
  const fp = (t.robot_spec || {}).footprint || [[0.6, 0.4], [0.6, -0.4], [-0.6, -0.4], [-0.6, 0.4]];
  g.beginPath();
  fp.forEach((p, i) => { const x = cx + (p[0] * Math.cos(yaw) - p[1] * Math.sin(yaw)) * s, y = cy - (p[0] * Math.sin(yaw) + p[1] * Math.cos(yaw)) * s; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath(); g.fillStyle = "rgba(61,220,132,.25)"; g.fill(); g.strokeStyle = "#3ddc84"; g.lineWidth = 2 * dpr; g.stroke();
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(yaw) * 1.6 * s, cy - Math.sin(yaw) * 1.6 * s); g.stroke();
}
// ---- 底部按钮: 下发任务列表里的第一个任务 / 终止；退出面板
const B = { inst: null, scene: null, flows: null, at: 0, tf: null, msg: "", msgUntil: 0, arm: "", armUntil: 0, busy: false };
async function send(method, url, body) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 10000);
  try {
    const r = await fetch(url, { method, signal: c.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((d.error && (d.error.message || d.error)) || d.message || d.detail || ("HTTP " + r.status));
    return d;
  } finally { clearTimeout(t); }
}
function say(text, sec) { B.msg = text; B.msgUntil = Date.now() + (sec || 4) * 1000; paintBtn(); }
function armed(k) { return B.arm === k && Date.now() < B.armUntil; }
function arm(k) { B.arm = k; B.armUntil = Date.now() + 3000; paintBtn(); setTimeout(paintBtn, 3100); }
function paintBtn() {
  const b = $("task"), x = $("exit"), tf = B.tf || {}, f = (B.flows || [])[0];
  x.textContent = armed("exit") ? "确认退出" : "退出"; x.className = "btn exit" + (armed("exit") ? " arm" : "");
  if (Date.now() < B.msgUntil) { b.textContent = B.msg; b.className = "btn off"; return; }
  if (tf.status === "running") {
    const n = (tf.steps || []).length;
    b.textContent = armed("stop") ? "再点一次终止任务" : "执行中" + (n ? " " + Math.min(n, (tf.step_index || 0) + 1) + "/" + n : "") + " · " + ((tf.flow || {}).name || (tf.flow || {}).id || "");
    b.className = "btn " + (armed("stop") ? "arm" : "run");
  } else if (!B.inst || B.inst.status !== "running") { b.textContent = "实例未运行"; b.className = "btn off"; }
  else if (!f) { b.textContent = B.flows ? "任务列表为空" : "读取任务列表…"; b.className = "btn off"; }
  else { b.textContent = "▶ 下发 " + (f.name || f.id); b.className = "btn"; }
}
async function loadFlows(force) {
  const sid = B.inst && B.inst.scene_id;
  if (!sid) { B.flows = null; B.scene = null; return; }
  if (!force && sid === B.scene && B.flows && Date.now() - B.at < 10000) return;
  try { B.flows = (await j("/api/hub/scenes/" + encodeURIComponent(sid) + "/taskflows")).taskflows || []; B.scene = sid; B.at = Date.now(); }
  catch (e) { if (sid !== B.scene) B.flows = null; }
}
$("task").onclick = async () => {
  if (B.busy || !B.inst || B.inst.status !== "running") return;
  const base = "/inst/" + B.inst.id + "/api/v2/taskflow/";
  B.busy = true;
  try {
    if ((B.tf || {}).status === "running") {
      if (!armed("stop")) { arm("stop"); return; }
      B.arm = ""; await send("POST", base + "stop"); B.tf = { status: "stopped" }; say("任务已终止");
    } else {
      await loadFlows(true);                       // 下发前重新读一次列表，拿到的是最新的第一个
      const f = (B.flows || [])[0];
      if (!f) { say("任务列表为空"); return; }
      B.tf = await send("POST", base + "run", { flow: f }); say("已下发 " + (f.name || f.id), 2);
    }
  } catch (e) { say("失败: " + (e.name === "AbortError" ? "超时" : e.message), 6); }
  finally { B.busy = false; paintBtn(); }
};
if (window.AgvCover && AgvCover.exit) {
  $("exit").style.display = "";
  $("exit").onclick = () => { if (!armed("exit")) { arm("exit"); return; } AgvCover.exit(); };
}
async function tick() {
  $("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  let node = null, inst = null, tel = null;
  try {
    if (!HUB.ns || Date.now() - HUB.at >= SLOW - 50) { [HUB.ns, HUB.is] = await Promise.all([j("/api/hub/nodes"), j("/api/hub/instances")]); HUB.at = Date.now(); }
    const ns = HUB.ns, is = HUB.is;
    node = (ns.nodes || []).find(n => n.online) || (ns.nodes || [])[0];
    const all = is.instances || [], want = Q.get("inst");
    inst = (want && all.find(i => i.id === want)) || all.find(i => i.status === "running") || all[0];
  } catch (e) { HUB.ns = null; $("dot").className = "dot bad"; $("node").textContent = "平台无响应"; draw(null); return; }
  if (node) {
    $("node").textContent = node.name + (node.model ? " · " + node.model.replace(/\s*\(.*\)/, "") : "");
    $("addr").textContent = ((node.ips || []).concat([node.lan_host]).find(a => /^(192\.168|10)\./.test(a || "")) || node.lan_host || (node.ips || [])[0] || location.hostname) + ":" + (location.port || 80);
    num("cpu", node.cpu_percent, "%", 0, node.cpu_percent > 85 ? "bad-t" : "");
    num("temp", node.temp_c, "°C", 0, node.temp_c >= 70 ? "bad-t" : node.temp_c >= 55 ? "warn-t" : "");
    num("mem", node.mem_percent, "%", 0, node.mem_percent > 85 ? "warn-t" : "");
    const img = (node.images || [])[0]; $("ver").textContent = img ? img.version : "—";
  }
  if (inst) {
    const st = inst.status;
    set("inst", inst.id + " · " + (STATUS[st] || st), st === "running" ? "ok-t" : st === "error" ? "bad-t" : "warn-t");
    $("scene").textContent = [inst.model_name, inst.scene_id].filter(Boolean).join(" @ ") || "—";
    if (st === "running" || st === "degraded") { try { tel = await j("/inst/" + inst.id + "/api/telemetry"); } catch (e) { tel = null; } }
  } else { set("inst", "没有实例", "warn-t"); $("scene").textContent = "—"; }
  const ss = tel && tel.sim_status;
  if (ss) {
    num("rtf", ss.rtf, "×", 2, ss.rtf < 0.9 ? "bad-t" : ss.rtf < 0.97 ? "warn-t" : "ok-t");
    set("nav", (NAV[tel.nav_status] || tel.nav_status || "—") + (tel.nav_dist_rem > 0.01 ? "  剩 " + tel.nav_dist_rem.toFixed(1) + " m" : "") + (tel.is_paused ? " (暂停)" : ""));
    set("pose", tel.x.toFixed(2) + ", " + tel.y.toFixed(2) + ", " + (Math.atan2(Math.sin(tel.yaw), Math.cos(tel.yaw)) * 180 / Math.PI).toFixed(0));
    set("ms", (ss.step_ms != null ? ss.step_ms.toFixed(2) : "—") + " / " + (ss.lidar_ms != null ? ss.lidar_ms.toFixed(1) : "—"));
  } else { num("rtf", null, "×", 2); set("nav", "—"); set("pose", "—"); set("ms", "—"); }
  draw(tel);
  B.inst = inst; B.tf = tel ? (tel.taskflow || { status: "idle" }) : null;
  await loadFlows(false); paintBtn();
  const ok = node && node.online && inst && inst.status === "running" && ss && ss.rtf >= 0.9;
  $("dot").className = "dot " + (ok ? "ok" : node && node.online ? "warn" : "bad");
}
// 一轮做完再排下一轮 (平台慢的时候不会堆积请求)；页面不可见时不刷新
(async function loop() {
  const t0 = Date.now();
  if (!document.hidden) { try { await tick(); } catch (e) {} }
  setTimeout(loop, Math.max(50, PERIOD - (Date.now() - t0)));
})();
</script>
</body>
</html>
